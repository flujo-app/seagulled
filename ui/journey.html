<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Seagulled</title><link rel="stylesheet" href="./journey.css"><script type="module" src="./journey.js"></script></head><body>
<main id="movie" aria-label="Seagulled" data-scene="idle" data-loading="true"><div id="frame" aria-hidden="true"><video id="movie-video" muted playsinline autoplay loop></video><video id="loading-video" src="journey-media/starfield-loading.mp4" muted playsinline autoplay loop preload="auto"></video></div><div class="shade"></div><section id="swarm-cards" aria-label="Swarms"></section><button id="new-swarm" type="button" aria-label="New swarm" hidden>+</button><span class="sr-only">F11 toggles fullscreen. Ctrl+Q quits. Ctrl+, opens accounts.</span><span id="live-status" class="sr-only" role="status" aria-live="polite"></span></main>
<div id="app-window-controls" popover="manual"><button id="app-close" class="icon" type="button" aria-label="Close app" title="Close app">×</button></div><dialog id="setup-dialog" class="glass setup" aria-label="Account setup">
<button id="setup-close" class="icon close" type="button" aria-label="Close setup">×</button>
<video id="cue-video" playsinline preload="auto" aria-label="Todd dialogue" hidden></video><button id="cue-replay" class="icon replay" type="button" aria-label="Play dialogue audio" hidden>▶</button><div id="setup-checking" class="checking" role="status" aria-label="Checking account sign-in" hidden><i></i></div>
<div id="provider-step"><div class="logos" role="group" aria-label="Inference accounts">
<div class="account"><button class="logo" type="button" data-provider="modal" aria-label="Modal" aria-pressed="false"><img src="brands/modal.svg" alt=""><i></i></button><button class="signin" type="button" data-signin="modal" aria-label="Sign in Modal" hidden>Sign in ↗</button></div>
<div class="account"><button class="logo" type="button" data-provider="claude" aria-label="Claude" aria-pressed="false"><img src="brands/claude.svg" alt=""><i></i></button><button class="signin" type="button" data-signin="claude" aria-label="Sign in Claude" hidden>Sign in ↗</button></div>
<div class="account"><button class="logo" type="button" data-provider="codex" aria-label="Codex" aria-pressed="false"><img src="brands/codex.png" alt=""><i></i></button><button class="signin" type="button" data-signin="codex" aria-label="Sign in Codex" hidden>Sign in ↗</button></div>
</div><button id="setup-confirm" class="primary" type="button" aria-label="Confirm accounts" disabled>→</button></div>
<div id="fly-step" hidden><button id="fly-connect" class="logo fly" type="button" aria-label="Connect Fly"><img src="brands/fly.svg" alt=""></button><button id="setup-back" class="icon back" type="button" aria-label="Back to inference accounts">←</button></div>
<div class="dots" aria-hidden="true"><i class="selected"></i><i></i></div><p id="setup-error" class="error" role="alert" hidden></p></dialog>
<dialog id="project-dialog" class="glass project" aria-labelledby="project-title"><header><h1 id="project-title">New swarm</h1><button class="icon" type="button" data-close="project-dialog" aria-label="Close swarm settings">×</button></header>
<form id="project-form"><label for="goal">Goal</label><textarea id="goal" rows="3" maxlength="50000" required></textarea>
<div class="slider-label"><label for="budget-slider">Budget</label><output id="budget-value">$50</output></div><input id="budget-slider" type="range" min="0" max="4" value="1" step="1" aria-valuetext="$50"><div class="ticks" aria-hidden="true"><span>$25</span><span>$50</span><span>$100</span><span>$500</span><span>∞</span></div>
<div class="slider-label"><label for="workers">Workers</label><output id="workers-value">10</output></div><input id="workers" type="range" min="1" max="100" value="10">
<div class="slider-label"><label for="agents">Agents per worker</label><output id="agents-value">10</output></div><input id="agents" type="range" min="1" max="10" value="10">
<div class="slider-label"><span>RAM</span><output id="memory-value">4 GB</output></div><div id="memory-edit-row" class="slider-label" hidden><label for="memory">Machine size</label><select id="memory"><option value="1024">1 GB</option><option value="2048">2 GB</option><option value="4096">4 GB</option></select></div>
<label for="goal-provider">Provider</label><div class="provider-select"><select id="goal-provider"><option value="modal">Modal</option><option value="claude">Claude</option><option value="codex">Codex</option></select><button id="manage-accounts" class="icon" type="button" aria-label="Connect accounts">↗</button></div>
<output id="compute-price" class="price" aria-label="Estimated compute price"></output><p id="project-error" class="error" role="alert" hidden></p><button id="project-save" class="primary" type="submit">Save</button></form></dialog>
</body></html>
