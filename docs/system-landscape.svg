<svg xmlns="http://www.w3.org/2000/svg" width="1880" height="1460" viewBox="0 0 1880 1460" role="img" aria-labelledby="title desc"><title id="title">Seagulled system landscape</title><desc id="desc">Nested machine, process, FLUJO workspace, MCP, external service and Git boundaries. Cloud execution is implemented but not qualified as a complete live run. Authentication labels A1 through A8 map to the companion authentication table. This is a source-derived architecture, not a live machine inventory.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#475569"/></marker><marker id="amber" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#b45309"/></marker></defs><g font-family="Segoe UI, Arial, sans-serif">
